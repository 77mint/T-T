<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Phone</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="stage">
<div class="phone">

    <!-- 状态栏 -->
    <div class="status-bar">
        <span id="clock">9:41</span>
        <span class="status-right">
            <svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
            <svg viewBox="0 0 16 12"><path d="M8 11.2 5.9 8.9a3 3 0 0 1 4.2 0L8 11.2Zm0-4.3a5.6 5.6 0 0 0-4 1.6L2.6 7.1a7.7 7.7 0 0 1 10.8 0l-1.4 1.4a5.6 5.6 0 0 0-4-1.6Zm0-4.3a9.9 9.9 0 0 0-7 2.9L-.4 4.1a11.9 11.9 0 0 1 16.8 0L15 5.5a9.9 9.9 0 0 0-7-2.9Z"/></svg>
            <svg viewBox="0 0 27 12"><rect x=".5" y=".5" width="22" height="11" rx="3.2" fill="none" stroke="#fff" stroke-opacity=".5"/><rect x="2" y="2" width="19" height="8" rx="2"/><path d="M24.5 4v4a2.3 2.3 0 0 0 0-4Z" fill-opacity=".5"/></svg>
        </span>
    </div>

    <div class="screen">

        <!-- 主屏幕 -->
        <div class="home">
            <div class="app-grid">
                <button class="app" data-app="books">
                    <span class="app-icon glass">
                        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                        </svg>
                    </span>
                    <span class="app-name">图书</span>
                </button>
            </div>
            <div class="page-dots"><span class="dot active"></span></div>
        </div>

        <!-- Dock -->
        <div class="dock glass">
            <button class="app" data-app="books">
                <span class="app-icon glass">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                    </svg>
                </span>
                <span class="app-name">图书</span>
            </button>
        </div>

        <!-- App 容器 -->
        <div class="app-view" id="appView">

            <!-- 图书 App -->
            <div class="books-app" id="booksApp">
                <div class="books-scroll">
                    <div class="page-title">首页</div>

                    <div class="shelf-section">
                        <div class="shelf-space"></div>
                        <div class="shelf-plank"></div>
                        <div class="shelf-under"></div>
                    </div>

                    <div class="goal-section">
                        <div class="goal-title">阅读目标</div>
                        <div class="goal-subtitle">坚持每天阅读，提升你的数据，<br>以激励你读完更多图书。</div>

                        <div class="arc-wrapper" id="arcOpen">
                            <svg viewBox="0 0 240 135">
                                <path class="arc-bg" d="M 28 125 A 92 92 0 0 1 212 125"/>
                                <path class="arc-fill" id="arcFill" d="M 28 125 A 92 92 0 0 1 212 125" stroke-dasharray="289" stroke-dashoffset="289"/>
                                <circle class="arc-dot" id="arcDot" cx="28" cy="125" r="4.5"/>
                            </svg>
                            <div class="time-display">
                                <div class="time-value" id="timeDisplay">0:00</div>
                                <div class="time-goal">
                                    (目标 <span id="goalMinutes">70</span> 分钟)
                                    <svg class="arrow" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
                                </div>
                            </div>
                        </div>

                        <div class="progress-details">
                            <div class="progress-title">今日阅读进度</div>
                            <div class="progress-remaining" id="progressRemaining">还需 70 分钟</div>
                            <div class="progress-desc">你正朝着每日目标奋进</div>
                        </div>

                        <button class="read-btn">
                            <div class="read-label" id="readLabel">开始阅读</div>
                            <div class="read-book" id="readBook"></div>
                        </button>
                    </div>
                </div>

                <div class="books-overlay" id="overlayBg"></div>
                <button class="close-btn" id="closeBtn">
                    <svg viewBox="0 0 24 24"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
                </button>

                <div class="adjust-card">
                    <div class="adjust-head">
                        <div class="adjust-head-title">调整目标</div>
                        <button class="adjust-done" id="adjustDone">完成</button>
                    </div>
                    <div class="picker">
                        <div class="picker-highlight"></div>
                        <div class="picker-col" id="hourCol"><div class="picker-scroll" id="hourScroll"></div></div>
                        <div class="picker-col" id="minCol"><div class="picker-scroll" id="minScroll"></div></div>
                        <span class="picker-label label-hour">小时</span>
                        <span class="picker-label label-min">分钟</span>
                    </div>
                </div>

                <nav class="books-tabbar glass">
                    <button class="tab-item active">
                        <svg viewBox="0 0 24 24"><path d="M3 10.2L12 3l9 7.2V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V10.2z"/><path d="M9 21V14h6v7"/></svg>
                        <span>首页</span>
                    </button>
                    <button class="tab-item">
                        <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                        <span>书架</span>
                    </button>
                    <button class="tab-item">
                        <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                        <span>笔记</span>
                    </button>
                    <button class="tab-item">
                        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        <span>我的</span>
                    </button>
                </nav>
            </div>

        </div>
    </div>

    <div class="home-indicator" id="homeBtn"></div>

</div>
</div>

<script src="js/app.js"></script>
</body>
</html>
